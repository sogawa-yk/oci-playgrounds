apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: my-test-cert
spec:
  # 生成された証明書を格納するk8s secretの名前
  secretName: my-test-secret-tls
  # 証明書の期間設定
  duration: 24h0m0s
  renewBefore: 12h0m0s
  # 証明書の内容
  commonName: example.com
  isCA: false
  privateKey:
    algorithm: RSA
    encoding: PKCS1
    size: 2048
  usages:
    - server auth
    - client auth
  # DNS名
  dnsNames:
    - example.com
    - www.example.com
  # issuerを指定
  issuerRef:
    name: selfsigned-issuer
    kind: Issuer
    group: cert-manager.io