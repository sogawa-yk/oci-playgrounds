- name: www.example.com.
  type: A
  ttl: 300
  rdata: ["1.2.3.4", "1.2.3.5"]

- name: example.com.
  type: TXT
  ttl: 300
  rdata:
    - "v=spf1 include:_spf.example.net ~all"

- name: www.example.com.
  type: AAAA
  ttl: 300
  rdata: ["2001:db8::1"]

- name: example.com.
  type: MX
  ttl: 3600
  rdata:
    - "10 mail1.example.com."
    - "20 mail2.example.com."